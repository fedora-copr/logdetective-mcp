name: Publish to PyPI and MCP registry
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  pypi_release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/logdetective-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      # Regex by https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
      - name: Check semver
        run: >
          echo "${{ github.ref }}" | grep -q -P "^refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          || exit 1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  mcp_registry_release:
    runs-on: ubuntu-latest
    needs:
      - pypi_release
    permissions:
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "v1.8.1"
      MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      # Regex by https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
      - name: Check semver
        run: >
          echo "${{ github.ref }}" | grep -q -P "^refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$"
          || exit 1
      - name: Download and verify mcp-publisher
        run: |
          BINARY_URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --output "$ARCHIVE" "$BINARY_URL"
          echo "${MCP_PUBLISHER_SHA256} $ARCHIVE" | sha256sum --check --status
          tar xz -f "$ARCHIVE" mcp-publisher

          chmod +x ./mcp-publisher

      - name: Wait for availability on Pypi.org
        run: |
          REF="${{ github.ref }}"
          TARGET_VERSION="${REF#refs/tags/v}"
          for attempt in {1..5}; do
              HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "https://pypi.org/pypi/logdetective-mcp/${TARGET_VERSION}/json")

              if [ "$HTTP_STATUS" -eq 200 ]; then
                exit 0
              fi

              if [ "$attempt" -lt 5 ]; then
                sleep 60
              fi
          done

          exit 1

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
